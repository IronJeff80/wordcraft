name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4

      - name: Sync with Upstream
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} --branch main

      - name: Disable Upstream Workflows
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          # Find all workflows in the repository except this sync file
          gh workflow list -R ${{ github.repository }} --json id,path -q '.[] | select(.path != ".github/workflows/sync-upstream.yml") | .id' | while read -r id; do
            echo "Disabling workflow ID: $id"
            gh workflow disable "$id" -R ${{ github.repository }} || true
          done
